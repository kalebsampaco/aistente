version: '3.8'

services:
  assistant:
    build: .
    container_name: ai-assistant
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data:
